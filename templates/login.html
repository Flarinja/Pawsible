<!doctype html>
<html>
<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">

<title>Pawsible</title>

</head>
<body>
    <nav class="navbar navbar-expand">
        <div class="container-fluid">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" style="color:rgb(255, 255, 255);" href="http://127.0.0.1:8000">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" style="color:rgb(255, 255, 255);" href="http://127.0.0.1:8000/info">About Us</a>
              </li>
                <a class="nav-link" style="color:rgb(255, 255, 255);" href="http://127.0.0.1:8000/login">Login</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" style="color:rgb(255, 255, 255);" type="submit">Search</button>
            </form>
        </div>
    </nav>
    <img src="static/img/PawsibleIcon.jpg" width="550" height="550" style="position:absolute; margin-left:100px; margin-top:90px;"></img>

    <div class="container">
        <div class="mx-5 my-5" style="text-align: right;">
            <br><br><br>
            <h1 style="color:rgb(249, 234, 234);">Enter Details:</h1>
            <br><br>
            <label for="userInput" style="color:rgb(255, 255, 255);" class="form-label">Email address</label>
            <br>
            <input type="email" class="form-control" id="userInput" style="width: 30%; text-align: right; float: right;" placeholder="name@example.com">
            <div id="emailHelpBlock" class="form-text" style="text-align: right;"></div>
            
            <br><br><br>
            
            <div class="mx-0" style="text-align: right;">
                <label for="inputPassword5" style="color:rgb(255, 255, 255);" class="form-label">Password</label>
                <br>
                <input type="password" id="inputPassword5" class="form-control" style="width: 30%; text-align: right; float: right;" aria-describedby="passwordHelpBlock">
                <div id="passwordHelpBlock" class="form-text" style="text-align: right;"></div>
            </div>
            
            <br><br>
            
            <div class="col-auto my-3" style="text-align: right;">
                <button type="submit" class="btn btn-primary mb-3" onclick="checkInput()">Login</button>
            </div>
        </div>
    </div>
    
    <script>
        function checkInput() {
            var userInput = document.getElementById("userInput").value;
            var userPassword = document.getElementById("inputPassword5").value;
            var correctString = "admin";
    
            if (userInput === correctString && userPassword === correctString) {
                window.location.href = "http://127.0.0.1:8000/dashboard";
            } else {
                alert("Incorrect email or password. Please try again.");
            }
        }
    </script>
    
    
  <style>
    body 
    {
      background: blue;
      background: linear-gradient(to right, #F7F7E9 50% , #5B2A09 50%);
    }
  </style>

  <!-- Optional JavaScript; choose one of the two! -->

  <!-- Option 1: Bootstrap Bundle with Popper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
  -->

</html>
